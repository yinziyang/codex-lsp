name: 原生平台回归
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          cache: npm
      - name: 安装锁定开发依赖
        run: npm ci --ignore-scripts
      - name: Windows 安装原生 LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --version=20.1.8 --yes --no-progress
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Linux 安装原生 clangd
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clangd
      - name: 类型检查
        run: npm run typecheck -- --noUnusedLocals --noUnusedParameters
      - name: 构建
        run: npm run build
      - name: Unix 完整上游与插件回归
        if: runner.os != 'Windows'
        run: npm test
      - name: Windows 插件回归
        if: runner.os == 'Windows'
        env:
          CODEX_LSP_EVIDENCE: .artifacts/ci-evidence
        run: npm run test:portable
      - name: 保存构建信息
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.os }}
          include-hidden-files: true
          path: |
            plugins/codex-lsp/dist/build-info.json
            .artifacts/ci-evidence
